applications:

  # Install the RHACS CRDs (Central and SecuredCluster)
  - metadata:
      name: rhacs-crds
    spec:
      destination:
        namespace: rhacs
        server: https://kubernetes.default.svc
      project: default
      source:
        directory:
          include: '{platform.stackrox.io_centrals.yaml,platform.stackrox.io_securedclusters.yaml}'
        path: operator/bundle/manifests
        repoURL: https://github.com/stackrox/stackrox
        targetRevision: 4.11.3
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - ServerSideApply=true

  # Install the rhacs-operators
  - metadata:
      name: rhacs-operators
    spec:
      ignoreDifferences:
        - kind: ServiceAccount
          jsonPointers:
            - /imagePullSecrets
      destination:
        namespace: rhacs
        server: https://kubernetes.default.svc
      project: default
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
      source:
        path: rhacs-operator-legacy
        repoURL: https://github.com/stackrox/acscs-manifests
        targetRevision: HEAD
        helm:
          valuesObject:
            operator:
              images:
                - deploymentName: "rhacs-operator-4.11.3"
                  image: "registry.redhat.io/advanced-cluster-security/rhacs-rhel9-operator@sha256:79b2148d133e88cc538dca567dc51b3536b14edc0d059a2e332dae3919725a29"
                  centralLabelSelector: "rhacs.redhat.com/version-selector=dev"
                  securedClusterLabelSelector: "rhacs.redhat.com/selector=dev"

tenantResources:
  default: |
    rolloutGroup: "dev"

    centralResources:
      limits:
        memory: 1Gi
      requests:
        cpu: 100m
        memory: 100Mi

    centralDbResources:
      limits:
        memory: 1Gi
      requests:
        cpu: 100m
        memory: 100Mi

    scannerResources:
      limits:
        memory: 2Gi
      requests:
        cpu: 100m
        memory: 100Mi

    scannerDbResources:
      limits:
        memory: 3Gi
      requests:
        cpu: 100m
        memory: 100Mi

    centralRdsCidrBlock: "10.1.0.0/16"
